
name: Build PAXLOAD APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract source ZIP
        run: unzip -o PAXLOAD_Source_Project.zip

      - name: Build APK
        run: gradle --no-daemon -p PAXLOAD_Source_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAXLOAD-debug-apk
          path: PAXLOAD_Source_Project/app/build/outputs/apk/debug/app-debug.apk
